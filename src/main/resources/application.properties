spring.application.name=demo
# spring.profiles.include=secret
# spring.config.import=application-secret.properties

## mybatis setting
## RDS endpoint=naranghiking.ch4s62qa68pz.ap-southeast-2.rds.amazonaws.com
spring.datasource.url=jdbc:mysql://localhost:3306/NarangHiking?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
#spring.datasource.url=jdbc:mysql://${DB_ENDPOINT}:3306/${DB_NAME}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.type-aliases-package=com.naranghiking

# Sql
spring.sql.init.mode=never

## MyBatis 관련 설정
mybatis.configuration.map-underscore-to-camel-case=true
logging.level.com.naranghiking.board.dao=DEBUG

jwt.secret=naranghiking-secret-key-must-be-at-least-32-bytes
jwt.access-expiration=1800000
jwt.refresh-expiration=604800000

spring.data.redis.host=localhost
spring.data.redis.port=6379

## 디버깅
logging.level.org.springframework.security=DEBUG
logging.level.com.naranghiking=DEBUG
logging.level.org.mybatis=DEBUG

# image upload path
file.images-dir=../uploads/images/

# ?? API ?
data.api.key=${DATA_API_KEY}

## gms
gms.api.key=${GMS_API_KEY}
gms.chat-url=${GMS_CHAT_URL}
gms.embedding-url=${GMS_EMBEDDING_URL}

## pinecone
pinecone.api.key=${PINECONE_API_KEY}
pinecone.url=${PINECONE_URL}

# db cloudflare
cloudflare.r2.account-id=${CLOUDFLARE_R2_ACCOUNT_ID}
cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY}
cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY}
cloudflare.r2.bucket-name=${CLOUDFLARE_R2_BUCKET_NAME}
cloudflare.r2.public-base-url=${CLOUDFLARE_R2_PUBLIC_BASE_URL}
