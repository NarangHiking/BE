spring.application.name=demo
spring.profiles.include=secret

## mybatis setting
spring.datasource.url=jdbc:mysql://localhost:3306/NarangHiking?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=hiking
spring.datasource.password=hiking
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.type-aliases-package=com.naranghiking

# Sql
spring.sql.init.mode=always

## MyBatis 관련 설정
mybatis.configuration.map-underscore-to-camel-case=true
logging.level.com.naranghiking.board.dao=DEBUG

jwt.secret=naranghiking-secret-key-must-be-at-least-32-bytes
jwt.access-expiration=1800000
jwt.refresh-expiration=604800000

spring.data.redis.host=localhost
spring.data.redis.port=6379

## 디버깅
logging.level.org.springframework.security=DEBUG
logging.level.com.naranghiking=DEBUG
logging.level.org.mybatis=DEBUG

# image upload path
file.images-dir=../uploads/images/

# ?? API ?
data.api.key=${DATA_API_KEY}

## swagger 주소
## http://localhost:8080/swagger-ui/index.html#