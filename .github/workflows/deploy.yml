name: NarangHiking Backend CI/CD # 이름은 아무거나 상관없음

on:
  push:
    branches: [ develop ] # develop 브랜치에 푸시될 때 자동 배포

jobs: # develop에 업데이트가 감지되면 수행되는 job들
  deploy:
    runs-on: ubuntu-latest # github actions가 빌드하고 테스트할 작업장(가상 컴퓨터)
    steps:
      - name: 소스코드 가져오기 # 빌드할 때 띄울 로그
        uses: actions/checkout@v3 # github에 있는 소스코드를 이 주소로 복사

      - name: 파일 구조 확인 (범인 찾기!)
        run: ls -R  # 로봇이 지금 보고 있는 모든 파일 목록을 출력

      - name: 자바 설정
        uses: actions/setup-java@v3
        with:
          java-version: '21' # 서버 자바 버전에 맞게 설정
          distribution: 'temurin' # java 오픈소스 이름

      - name: 빌드 수행 # 다음 코드들을 수행 디렉토리 이동 > mvwn 실행 권한 부여 > 빌드
        run: |
          cd BE
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: 파일 전송 (SCP) # GithubActions가 빌드한 파일을 EC2로 전송
        uses: appleboy/scp-action@master
        with: # EC2 접속 설정
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "BE/target/*.jar"
          target: "/home/ec2-user/"
          strip_components: 1 # 다른 경로는 빼고 target/*.jar만 챙기기

      - name: 서버 재시작 (SSH)
        uses: appleboy/ssh-action@master # 원격 서버에 명령을 내릴 수 있게 해주는 도구
        with: # 아래 script부터 명령어가 EC2에서 차례로 수행
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/BE
            fuser -k 8080/tcp || true
            nohup java -jar target/demo-0.0.1-SNAPSHOT.jar > app.log 2>&1 &